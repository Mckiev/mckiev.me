<script>
  // Default: instant redirect to the dashboard (home-screen launches land here).
  // #install: stay on this page so Safari's "Add to Home Screen" picks up the icon,
  // and strip the hash so the saved bookmark is the plain, redirecting URL.
  if (location.hash === "#install") {
    history.replaceState(null, "", location.pathname);
    document.documentElement.className = "install";
  } else {
    // iOS opens claude.ai links in the Claude app (universal links). x-safari-https:// forces a Safari tab;
    // if the scheme isn't handled (non-iOS / old iOS), fall back to the normal URL.
    var u = "https://claude.ai/artifact/69pbB2jivPvas516c85t9S";
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !/[?&]app=1/.test(location.search)) {
      location.href = "x-safari-" + u;
      setTimeout(function () { if (document.visibilityState === "visible") location.replace(u); }, 1500);
    } else {
      location.replace(u);
    }
  }
</script>
<style>
  :root { --a: #3b5bb5; --b: #1a2150; --bg: #f6f5f2; --fg: #1b1b1f; --muted: #6b6b73; --card: #ffffff; --line: rgba(0,0,0,.08); }
  @media (prefers-color-scheme: dark) { :root { --bg: #111114; --fg: #f2f2f4; --muted: #9a9aa3; --card: #1c1c21; --line: rgba(255,255,255,.08); } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  #install { display: none; }
  html.install #install { display: block; }
  html.install #fallback { display: none; }
  main { max-width: 420px; margin: 0 auto; padding: max(48px, env(safe-area-inset-top)) 16px 40px; text-align: center; }
  .icon { width: 120px; height: 120px; border-radius: 27px; box-shadow: 0 12px 30px -8px var(--a), 0 2px 6px rgba(0,0,0,.15); }
  h1 { font-size: 28px; margin: 20px 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  ol { list-style: none; padding: 0; margin: 0 0 24px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  li { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
  li + li { border-top: 1px solid var(--line); }
  .n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 15px; color: #fff; background: linear-gradient(135deg, var(--a), var(--b)); }
  .share { display: inline-block; vertical-align: -3px; width: 18px; height: 18px; color: #0a84ff; }
  .note { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  a.btn { display: inline-block; padding: 12px 22px; border-radius: 12px; color: #fff; text-decoration: none; font-weight: 600; background: linear-gradient(135deg, var(--a), var(--b)); }
</style>
</head>
<body>
<a id="fallback" href="https://claude.ai/artifact/69pbB2jivPvas516c85t9S">Training Log</a>
<main id="install">

  <h1>Training</h1>
  <p class="sub">Иконка на экран «Домой»</p>
  <ol>
    <li><span class="n">1</span><span>Нажми <b>Поделиться</b> <svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg> <span style="color:var(--muted)">(в iOS 26 — через <b>⋯</b>)</span></span></li>
    <li><span class="n">2</span><span>Выбери <b>На экран «Домой»</b></span></li>
    <li><span class="n">3</span><span>Нажми <b>Добавить</b></span></li>
  </ol>
  <p class="note">Если есть переключатель «Открывать как веб-приложение» — выключи его, чтобы дашборд открывался в Safari, где ты залогинен в Claude.</p>
  <a class="btn" href="https://claude.ai/artifact/69pbB2jivPvas516c85t9S">Открыть Training →</a>
</main>
